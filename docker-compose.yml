version: "3.9"

services:
  minirag:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
