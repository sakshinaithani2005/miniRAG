name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install rank-bm25 structlog pydantic-settings

      - name: Lint with ruff
        run: ruff check src/ tests/ eval/

      - name: Type-check with mypy
        run: mypy src/minirag/ --ignore-missing-imports
        continue-on-error: true  # Non-blocking until stubs are complete

      - name: Run tests with coverage
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'fake_key_for_ci' }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY || 'fake_key_for_ci' }}
          PINECONE_INDEX_NAME: mini-rag
        run: |
          pytest tests/ \
            --cov=src/minirag \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
